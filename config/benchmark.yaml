# Terminal-Bench benchmark 配置
# 唯一的数据源是 case_metadata.json，本文件只存运行时参数

model: glm-5.3-max

# 超时设置（秒）
timeout:
  agent: 3600          # 每个 case agent 最长运行时间
  verifier_build: 3600 # verifier Docker image 构建时间
  command: 300         # 单次 docker exec 命令超时

# case 筛选（仅从 case_metadata.json 中 enabled=true 的 case 里筛选）
# 满足"所有条件"的 case 才会被选中
case_filter:
  # 只跑指定版本，空数组 = 全部版本
  # 例: ["2.1"] = 只跑 TB 2.1
  # 例: ["2.1", "3.0"] = 全部
  include_versions: []

  # 只跑指定难度，空数组 = 全部难度
  # 例: ["易"] = 只跑容易的
  # 例: ["易", "中"] = 跑容易+中等
  include_difficulties: []

  # 明确排除的 case（版本/名称）
  # 例: ["2.1/caffe-cifar-10", "3.0/takens-embedding-lean"]
  exclude_cases: []